<title>Nift — $[title]</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nift — $[title]. Documentation, examples and guidance for the fast, dependency-aware website templating and build system.">
@if(name != "/"){
<link rel="canonical" href="https://nift.dev/$[name].html">
}
<meta name="theme-color" content="#071c29">
<meta name="robots" content="index,follow">
<meta name="application-name" content="Nift">
<link rel="sitemap" type="application/xml" href="/sitemap.xml">
<link rel="alternate" type="text/plain" href="/llms.txt" title="Nift agent index">
<link rel="alternate" type="text/markdown" href="/agents.md" title="Nift agent guide">
<script>
(() => {
	const mode = localStorage.getItem('nift-theme') || 'system';
	const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
	document.documentElement.dataset.themeMode = mode;
	document.documentElement.dataset.theme = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
})();
</script>
<link rel="stylesheet" href="@pathto('public/assets/css/style.css')">
